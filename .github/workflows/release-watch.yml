name: release-watch

on:
  schedule:
    # Weekly: open an issue when a pinned client falls behind its latest release.
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    name: Compare pinned clients with upstream releases
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check releases
        run: bash scripts/check-release.sh
        env:
          GH_TOKEN: ${{ github.token }}
